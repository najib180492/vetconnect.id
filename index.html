<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VetBook - Booking Dokter Hewan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Library Supabase via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans pb-10">

  <!-- Header / Navbar -->
  <header class="bg-teal-600 text-white p-4 shadow-md sticky top-0 z-10">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold flex items-center gap-2">🐾 VetBook</h1>
      <span class="text-xs bg-teal-800 px-2 py-1 rounded-full">v1.0 MVP</span>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-6">

    <!-- Profil Dokter -->
    <section class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 text-center">
      <div class="w-24 h-24 bg-teal-100 text-teal-600 rounded-full mx-auto flex items-center justify-center text-3xl font-bold mb-3 border-2 border-teal-500">
        👨‍⚕️
      </div>
      <h2 class="text-xl font-bold text-gray-900">drh. Najib</h2>
      <p class="text-sm text-teal-600 font-medium">Vet Consultant</p>
      <p class="text-xs text-gray-500 mt-1">📍 Malang, Indonesia</p>
    </section>

    <!-- Daftar Layanan -->
    <section class="space-y-3">
      <h3 class="text-md font-bold text-gray-800 flex items-center gap-1">
        🩺 Pilih Layanan
      </h3>

      <div class="bg-white p-4 rounded-xl border border-gray-200 flex justify-between items-center shadow-sm">
        <div>
          <h4 class="font-bold text-gray-900">Konsultasi Pet & Poultry</h4>
          <p class="text-sm font-semibold text-teal-600 mt-1">Rp 60.000</p>
        </div>
        <button type="button" onclick="pilihLayanan('Konsultasi Pet & Poultry', 60000)" class="bg-teal-600 text-white px-4 py-2 rounded-lg text-xs font-semibold hover:bg-teal-700 active:scale-95 transition-all">
          Pilih
        </button>
      </div>

      <div class="bg-white p-4 rounded-xl border border-gray-200 flex justify-between items-center shadow-sm">
        <div>
          <h4 class="font-bold text-gray-900">Vaksinasi Hewan</h4>
          <p class="text-sm font-semibold text-teal-600 mt-1">Rp 150.000</p>
        </div>
        <button type="button" onclick="pilihLayanan('Vaksinasi Hewan', 160000)" class="bg-teal-600 text-white px-4 py-2 rounded-lg text-xs font-semibold hover:bg-teal-700 active:scale-95 transition-all">
          Pilih
        </button>
      </div>
    </section>

    <!-- Form Booking -->
    <section id="section-booking" class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 space-y-4 hidden">
      <h3 class="text-md font-bold text-teal-700 border-b pb-2">📅 Formulir Booking</h3>

      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Layanan Terpilih</label>
        <input type="text" id="selected-service" readonly class="w-full p-2.5 bg-gray-50 border rounded-lg text-sm font-bold text-teal-800">
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Pilih Tanggal</label>
        <input type="date" id="booking-date" class="w-full p-2.5 border rounded-lg text-sm">
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Nama Pemilik</label>
        <input type="text" id="owner-name" placeholder="Contoh: Budi" class="w-full p-2.5 border rounded-lg text-sm">
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Nama & Jenis Hewan</label>
        <input type="text" id="pet-info" placeholder="Contoh: Milo (Kucing) / Ayam Broiler" class="w-full p-2.5 border rounded-lg text-sm">
      </div>

      <button type="button" onclick="kirimBooking()" class="w-full bg-teal-600 text-white py-3 rounded-xl font-bold shadow-lg text-sm hover:bg-teal-700 active:scale-95 transition-all">
        Konfirmasi Booking via WhatsApp
      </button>
    </section>

  </main>

  <!-- Script Logika & Inisialisasi Database -->
  <script>
    const SUPABASE_URL = "https://gobaqeeadobzpscqexax.supabase.co";
    const SUPABASE_KEY = "sb_publishable_u_79Qw9qcA_hhfTx01w2fA_Cu";
    
    // Inisialisasi Supabase tanpa bentrok variabel
    let dbSupabase = null;
    if (typeof window.supabase !== 'undefined' && window.supabase.createClient) {
      dbSupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    }

    let layananAktif = '';

    function pilihLayanan(nama, harga) {
      layananAktif = nama;
      document.getElementById('selected-service').value = `${nama} - Rp ${harga.toLocaleString('id-ID')}`;
      
      const formSection = document.getElementById('section-booking');
      formSection.classList.remove('hidden');
      formSection.scrollIntoView({ behavior: 'smooth' });
    }

    async function kirimBooking() {
      const tanggal = document.getElementById('booking-date').value;
      const pemilik = document.getElementById('owner-name').value;
      const hewan = document.getElementById('pet-info').value;

      if (!tanggal || !pemilik || !hewan) {
        alert('Mohon lengkapi semua data booking!');
        return;
      }

      // 1. Simpan ke Supabase jika koneksi siap
      if (dbSupabase) {
        try {
          await dbSupabase.from('bookings').insert([
            { 
              nama_pemilik: pemilik, 
              info_hewan: hewan, 
              layanan: layananAktif, 
              tanggal_booking: tanggal 
            }
          ]);
        } catch (err) {
          console.log('Penimpanan database dilewati, membuka WhatsApp...');
        }
      }

      // 2. Kirim pesan ke WhatsApp Anda
      const noWA = "6285725175566";
      const pesan = `Halo drh. Najib, saya ingin melakukan booking layanan VetBook:%0A%0A` +
                    `📌 *Layanan:* ${layananAktif}%0A` +
                    `📅 *Tanggal:* ${tanggal}%0A` +
                    `👤 *Pemilik:* ${pemilik}%0A` +
                    `🐾 *Hewan:* ${hewan}%0A%0A` +
                    `Mohon konfirmasi ketersediaan slotnya. Terima kasih!`;

      window.open(`https://wa.me/${noWA}?text=${pesan}`, '_blank');
    }
  </script>
</body>
</html>
